<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="500" height="500" rx="40" fill="#0A0C10" />
  <circle cx="250" cy="200" r="140" fill="url(#amberGlow)" />
  <circle cx="250" cy="200" r="130" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.6" />

  <!-- Panther Stylized Geometric Icon -->
  <g transform="translate(150, 100) scale(0.8)">
    <!-- Ears -->
    <polygon points="40,30 75,70 20,80" fill="url(#goldGrad)" />
    <polygon points="210,30 175,70 230,80" fill="url(#goldGrad)" />
    <polygon points="50,45 75,70 35,80" fill="#0A0C10" />
    <polygon points="200,45 175,70 215,80" fill="#0A0C10" />

    <!-- Head Outline -->
    <path d="M 75,70 L 125,50 L 175,70 L 220,105 L 205,160 L 170,210 L 125,230 L 80,210 L 45,160 L 30,105 Z" fill="#121620" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Forehead & Nose Bridge -->
    <polygon points="125,50 100,110 125,140 150,110" fill="url(#goldGrad)" opacity="0.9" />
    <polygon points="125,140 110,180 140,180" fill="url(#goldGrad)" />
    <polygon points="110,180 125,200 140,180" fill="#FFFFFF" />

    <!-- Panther Piercing Eyes (Glowing) -->
    <polygon points="65,120 100,125 75,135" fill="#FDE047" filter="url(#glow)" />
    <polygon points="185,120 150,125 175,135" fill="#FDE047" filter="url(#glow)" />
    <polygon points="70,123 90,126 77,131" fill="#0A0C10" />
    <polygon points="180,123 160,126 173,131" fill="#0A0C10" />

    <!-- Cheeks & Jaw Structure -->
    <polyline points="45,160 85,165 110,180" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <polyline points="205,160 165,165 140,180" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <polygon points="100,205 125,230 150,205 125,215" fill="url(#goldGrad)" />
    
    <!-- Whiskers -->
    <line x1="90" y1="185" x2="30" y2="195" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="90" y1="192" x2="35" y2="210" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="160" y1="185" x2="220" y2="195" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="160" y1="192" x2="215" y2="210" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Typography -->
  <text x="250" y="360" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#CBD5E1" letter-spacing="9">BOTEQUIM</text>
  <text x="250" y="415" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="46" font-weight="900" fill="url(#goldGrad)" letter-spacing="5">PANTERA</text>
  
  <rect x="160" y="435" width="180" height="2" fill="url(#goldGrad)" opacity="0.8" />
  <text x="250" y="458" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="3.5">BAURU CAXIENSE &amp; CHOPP ARTESANAL</text>
</svg>
